; ============================================================================
;  ESP32-S3 + HS-S62A-PL (MFRC522 / SI522A) I2C 读卡器固件
;
;  两个构建环境：
;    rymcu-esp32-s3-devkitc-1   生产固件（分层架构 + FreeRTOS + 看门狗）
;    bringup                    硬件自检固件（查接线/地址/芯片，不跑业务）
;
;      pio run -e rymcu-esp32-s3-devkitc-1 -t upload
;      pio run -e bringup                   -t upload
;      pio device monitor -b 115200
; ============================================================================
[platformio]
default_envs = rymcu-esp32-s3-devkitc-1

[env]
; ---- 版本锁死 --------------------------------------------------------------
; 绝不用 @latest：同一条产线在不同时间编译会得到不同固件，事后无法复现现场。
; 6.11.0 搭配 framework-arduinoespressif32 3.20017（arduino-esp32 2.0.17）。
platform = espressif32@6.11.0
board = rymcu-esp32-s3-devkitc-1
framework = arduino

monitor_speed = 115200
; 崩溃时把地址翻译成函数名+行号，否则现场只拿到一串十六进制
monitor_filters = esp32_exception_decoder, time

build_flags =
    -D ARDUINO_USB_CDC_ON_BOOT=1
    -D ARDUINO_USB_MODE=1
    ; 0=全关 1=只留错误 2=警告以上。业务日志走 appLogLine，不由 IDF 管
    -D CORE_DEBUG_LEVEL=1
    -Wall
    -Wno-unused-parameter
    -Wl,-Map,firmware.map

[env:rymcu-esp32-s3-devkitc-1]
build_src_filter = +<*> -<bringup/>

[env:bringup]
extends = env:rymcu-esp32-s3-devkitc-1
build_src_filter = +<bringup/> +<app_log.cpp> +<i2c_bus.cpp> +<rfid_reader.cpp>
